<!-- theme paint se pehle set hota hai taaki flash na ho -->
<script>
  (function () {
    // RAYN.AI dark-first hai — light tabhi jab user ne khud choose kiya ho.
    var mode = 'dark';
    try {
      // Value JSON ke roop me store hoti hai ('"dark"'), isliye parse zaroori hai.
      var raw = localStorage.getItem('ha.theme');
      var saved = null;
      if (raw) { try { saved = JSON.parse(raw); } catch (e) { saved = raw; } }
      if (saved !== 'light' && saved !== 'dark') saved = null;
      mode = saved || 'dark';
    } catch (e) { /* localStorage blocked — dark hi rahega */ }
    document.documentElement.setAttribute('data-theme', mode);
  })();
</script>

html, body, #root { height: 100%; }
body {

/* Ambient violet/indigo wash — fixed layer, app shell iske upar transparent
   baithta hai. pointer-events none taaki clicks pass ho jaayein. */
body::before {
  content: '';

  inset: 0;
  z-index: 0;
  pointer-events: none;

}

/* theme switch ke waqt bade surfaces ko halka cross-fade */
body, .themed { transition: background-color .18s ease, border-color .18s ease, color .18s ease; }

/* Accent helpers — gradient ek hi jagah define hai, teeno stops tokens se. */
.accent-grad { background-image: linear-gradient(135deg, var(--accent-from), var(--accent-via), var(--accent-to)); }
.accent-text {
  background-image: linear-gradient(120deg, var(--accent-from), var(--accent-via));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* Primary CTA ka dheema saans — halka, taaki dhyan khiche par chubhe na. */
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 10px 30px -12px var(--glow), 0 0 0 0 rgba(99, 102, 241, 0); }
  50%      { box-shadow: 0 16px 44px -10px var(--glow), 0 0 0 5px rgba(99, 102, 241, .10); }
}
.glow-pulse { animation: glowPulse 3s ease-in-out infinite; }

/* Card hover par border ka halka roshan hona — sirf border, koi lift nahi. */
.glow-border { transition: border-color .2s ease, box-shadow .2s ease; }
.glow-border:hover { border-color: var(--brand-border); box-shadow: 0 0 0 1px var(--brand-subtle), 0 18px 40px -28px var(--glow); }

/* Scrollbar bhi tokens par. Thumb par 4px transparent border content-box clip
   ke saath padding ka kaam karta hai, isliye wo patli aur rounded dikhti hai. */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

::-webkit-scrollbar { width: 14px; height: 14px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--border-strong);
  border-radius: 999px;
  border: 4px solid transparent;
  background-clip: content-box;
  transition: background-color .15s ease;
}
::-webkit-scrollbar-thumb:hover { background-color: var(--text-disabled); background-clip: content-box; }
::-webkit-scrollbar-thumb:active { background-color: var(--text-muted); background-clip: content-box; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.fade-up { animation: fadeUp .16s ease-out both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.toast-in { animation: toastIn .2s cubic-bezier(.16,1,.3,1) both; }
@keyframes shimmer { 100% { transform: translateX(100%); } }
.skeleton { position: relative; overflow: hidden; background: var(--skeleton); border-radius: 4px; }
.skeleton::after {
  content: ''; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--skeleton-hi), transparent);
  animation: shimmer 1.4s infinite;
}
@keyframes barSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
.progress-indeterminate::after {
  content: ''; position: absolute; inset-block: 0; width: 25%;
  background: var(--brand); border-radius: 999px; animation: barSlide 1.3s ease-in-out infinite;
}

/* Range input ko tokens par laana padta hai — native accent theme follow
   nahi karta. Track aur thumb dono explicitly paint hote hain. */
input[type='range'].rayn-range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 20px; background: transparent; cursor: pointer;

input[type='range'].rayn-range::-moz-range-track { height: 4px; border-radius: 999px; background: var(--border-strong); }
input[type='range'].rayn-range::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--accent-from); }
input[type='range'].rayn-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  margin-top: -6px; height: 16px; width: 16px; border-radius: 999px;
  background: #FFFFFF; border: 3px solid var(--brand);
  box-shadow: 0 2px 8px -2px var(--glow);

input[type='range'].rayn-range::-moz-range-thumb {
  height: 16px; width: 16px; border: 3px solid var(--brand); border-radius: 999px;
  background: #FFFFFF; box-shadow: 0 2px 8px -2px var(--glow);

input[type='range'].rayn-range:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 4px; border-radius: 999px; }

@media (prefers-reduced-motion: reduce) {

  del(path) { return api.req(path, { method: 'DELETE' }); },
  post(path, body) {
    return api.req(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  },
};

const jobKey = (j) => j.url || `${j.source}:${j.title}:${j.company}`;

/* Contacts view se khula hua job asli posting nahi, sirf draft ka stub ho
   sakta hai — uske paas key pehle se hoti hai. */
const keyOf = (j) => j.__key || jobKey(j);

/* navigator.clipboard sirf secure context me milta hai; local http par
   purana execCommand hi bachata hai. */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch { return false; }
  }
}

const SOURCE_LABEL = { both: 'LinkedIn + Indeed', linkedin: 'LinkedIn', indeed: 'Indeed' };
const sourceLabel = (h) => SOURCE_LABEL[h.source] || (Array.isArray(h.sources) ? h.sources.join(' + ') : '—');

/* Score band: color ke saath hamesha ek text label bhi jaata hai,
   taaki matlab sirf rang se na nikalna pade. */
function scoreBand(score) {
  if (score == null) return { label: 'Not scored', text: 'text-fg-muted', bar: 'bg-line-strong' };
  if (score >= 75) return { label: 'Strong match', text: 'text-success-text', bar: 'bg-success' };
  if (score >= 55) return { label: 'Good match', text: 'text-warning-text', bar: 'bg-warning' };
  if (score >= 35) return { label: 'Partial match', text: 'text-fg-sec', bar: 'bg-line-strong' };
  return { label: 'Weak match', text: 'text-fg-muted', bar: 'bg-line-strong' };
}

/* Backend per-job skills nahi deta — JD ke skills me se wahi dikhate hain
   jo posting ke text me actually mile. */
function matchedSkills(job, skills) {
  if (!skills?.length) return [];
  const hay = `${job.title || ''} ${job.description || ''}`.toLowerCase();
  return skills.filter((s) => s && hay.includes(String(s).toLowerCase())).slice(0, 4);
}

const fmtBytes = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`);
const timeAgo = (iso) => {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
};

/* Status message — icon + status word + text. Rang teesra signal hai, akela nahi. */
const STATUS = {

  error:   { Icon: XCircle,      word: 'Error',   cls: 'text-error-text',   bg: 'bg-error-subtle',   bd: 'border-error-border' },

};

function InlineStatus({ type = 'error', children }) {
  const { Icon, word, cls, bg, bd } = STATUS[type];

function Toasts({ items, dismiss, raised }) {

    <div role="status" aria-live="polite"
         className={`pointer-events-none fixed right-5 z-40 flex w-80 max-w-[calc(100vw-2.5rem)] flex-col gap-2 transition-[bottom] duration-200 ${

          <AnimatePresence initial={false} mode="wait">
            {attached ? (
              <motion.span
                key="chip"
                initial={{ opacity: 0, scale: 0.94 }}
                animate={{ opacity: 1, scale: 1 }}
                exit={{ opacity: 0, scale: 0.94 }}
                transition={{ duration: 0.15, ease: 'easeOut' }}
                className="inline-flex min-w-0 items-center gap-2 rounded-lg border border-line bg-surface py-1 pl-2 pr-1 shadow-sm"
              >
                <FileText size={14} aria-hidden className="shrink-0 text-brand-text" />
                <span className="truncate text-sm font-medium text-fg">{attached.name}</span>
                <span className="shrink-0 text-xs tabular-nums text-fg-muted">{fmtBytes(attached.size)}</span>
                <button onClick={() => { setAttached(null); if (fileRef.current) fileRef.current.value = ''; }}

                        className={`shrink-0 rounded p-1 text-fg-muted transition-colors hover:bg-surface-hover hover:text-fg ${ring}`}>
                  <X size={12} />
                </button>
              </motion.span>
            ) : (
              <motion.button
                key="upload" type="button" onClick={pick} disabled={uploading}
                initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                className={`inline-flex items-center gap-2 rounded-lg px-2 py-1 text-sm font-medium text-fg-sec transition-colors hover:bg-surface hover:text-fg disabled:opacity-60 ${ring}`}
              >
                {uploading
                  ? <><Loader2 size={14} aria-hidden className="animate-spin text-brand-text" /> Reading document…</>
                  : <><Paperclip size={14} aria-hidden /> Attach resume or JD</>}
              </motion.button>
            )}
          </AnimatePresence>
        </div>

        <div className="flex flex-wrap items-center justify-end gap-2">
          <span className="rounded-md border border-line bg-surface px-2 py-1 text-xs tabular-nums text-fg-muted">
            {chars.toLocaleString()} chars
          </span>
          <Button size="md" variant="ghost" onClick={() => { setJd(SAMPLE_JD); setTab('prompt'); }}>
            <FileText size={13} aria-hidden /> Load Sample JD
          </Button>
        </div>
      </div>

      <input ref={fileRef} type="file" className="sr-only"
             accept=".pdf,.docx,.doc,.txt,.md,.html,.htm,.rtf,.pptx"
             onChange={(e) => e.target.files?.[0] && uploadFile(e.target.files[0])} />

      {dragging && (
        <div className="pointer-events-none absolute inset-0 grid place-items-center rounded-2xl border-2 border-dashed border-brand bg-brand-subtle backdrop-blur-sm">
          <span className="text-body font-semibold text-brand-text">Drop the file to read it</span>
        </div>
      )}

      {error && <div className="px-4 pb-3"><span id="jd-error"><InlineStatus type="error">{error}</InlineStatus></span></div>}
    </section>
  );
}

/* Model pill. Active model server se aata hai — baaki entries dikhti to hain
   par choose nahi hoti, kyunki backend abhi ek hi model chalata hai. */
function ModelPill({ model }) {
  const [open, setOpen] = useState(false);
  const box = useRef(null);

  useEffect(() => {
    if (!open) return;
    const down = (e) => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
    const key = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', down);
    document.addEventListener('keydown', key);
    return () => { document.removeEventListener('mousedown', down); document.removeEventListener('keydown', key); };
  }, [open]);

  return (
    <div ref={box} className="relative">
      <button
        type="button" onClick={() => setOpen((o) => !o)} aria-haspopup="listbox" aria-expanded={open}
        className={`flex h-9 items-center gap-2 rounded-full border border-line bg-glass px-3 text-sm font-medium text-fg-sec backdrop-blur-md transition-colors hover:border-brand-border hover:text-fg ${ring}`}
      >
        <Zap size={13} aria-hidden className="text-brand-text" />
        <span className="hidden max-w-[150px] truncate sm:inline">{modelLabel(model)}</span>
        <span aria-hidden className="h-1.5 w-1.5 rounded-full bg-success shadow-[0_0_8px_var(--success)]" />
        <ChevronDown size={13} aria-hidden className={`transition-transform duration-200 ${open ? 'rotate-180' : ''}`} />
      </button>

      <AnimatePresence>
        {open && (
          <motion.ul
            role="listbox" aria-label="Scoring model"
            initial={{ opacity: 0, y: -4 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -4 }}
            transition={{ duration: 0.14 }}
            className="themed absolute right-0 top-[calc(100%+6px)] z-40 w-72 overflow-hidden rounded-xl border border-line bg-glass-strong p-1 shadow-lg backdrop-blur-xl"
          >
            {MODELS.map((m) => {
              const active = m.id === model;
              return (
                <li key={m.id} role="option" aria-selected={active} aria-disabled={!active}>
                  <div className={`flex items-start gap-2.5 rounded-lg px-2.5 py-2 ${active ? 'bg-brand-subtle' : ''}`}>
                    <span aria-hidden className={`mt-1 h-1.5 w-1.5 shrink-0 rounded-full ${active ? 'bg-success' : 'bg-neutral-fill'}`} />
                    <span className="min-w-0 flex-1">
                      <span className={`block truncate text-sm font-semibold ${active ? 'text-brand-text' : 'text-fg-sec'}`}>{m.label}</span>
                      <span className="block truncate text-xs text-fg-muted">{m.hint}</span>
                    </span>
                    {active
                      ? <Check size={13} strokeWidth={3} aria-hidden className="mt-0.5 shrink-0 text-brand-text" />
                      : <span className="mt-px shrink-0 rounded border border-line px-1.5 text-xs font-medium text-fg-muted">Soon</span>}
                  </div>
                </li>
              );
            })}
            <li className="border-t border-line-subtle px-2.5 py-2 text-xs text-fg-muted">
              Set by <code className="text-fg-sec">OPENROUTER_MODEL</code> on the server.
            </li>
          </motion.ul>
        )}
      </AnimatePresence>
    </div>
  );
}

/* Bell recent activity dikhati hai — wahi events jo toast bankar guzre.
   Unread count last-opened ke baad aaye events ka hai. */

    const key = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', down);
    document.addEventListener('keydown', key);
    return () => { document.removeEventListener('mousedown', down); document.removeEventListener('keydown', key); };
  }, [open]);

  return (
    <div ref={box} className="relative">
      <button

        aria-label={unread > 0 ? `Notifications, ${unread} unread` : 'Notifications'}

      >

          <motion.div
            initial={{ opacity: 0, y: -4 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -4 }}
            transition={{ duration: 0.14 }}

/* Views par jump, aur past runs / saved matches me naam se search.
   Sab kuch already loaded state par chalta hai — koi extra request nahi. */
function CommandPalette({ open, onClose, go, history, saved, openHistory }) {
  const [q, setQ] = useState('');
  const inputRef = useRef(null);

  useEffect(() => { if (open) { setQ(''); setTimeout(() => inputRef.current?.focus(), 20); } }, [open]);

  const needle = q.trim().toLowerCase();
  const views = NAV.filter((n) => !needle || n.label.toLowerCase().includes(needle));
  const runs = (history || [])
    .filter((h) => !needle || `${h.title || ''} ${h.location || ''}`.toLowerCase().includes(needle))
    .slice(0, 5);
  const matches = (saved || [])
    .filter((j) => !needle || `${j.title || ''} ${j.company || ''}`.toLowerCase().includes(needle))
    .slice(0, 5);

  if (!open) return null;

  const Row = ({ Icon, title, sub, onPick }) => (
    <button type="button" onClick={() => { onPick(); onClose(); }}
            className={`flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left transition-colors hover:bg-surface-hover ${ring}`}>
      <Icon size={15} aria-hidden className="shrink-0 text-fg-muted" />
      <span className="min-w-0 flex-1">
        <span className="block truncate text-sm font-medium text-fg">{title}</span>
        {sub && <span className="block truncate text-xs text-fg-muted">{sub}</span>}
      </span>
      <ArrowRight size={13} aria-hidden className="shrink-0 text-fg-disabled" />
    </button>
  );

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center px-4 pt-[12vh]" role="dialog" aria-modal="true" aria-label="Command palette">
      <div className="absolute inset-0 bg-overlay backdrop-blur-sm" onClick={onClose} aria-hidden />
      <motion.div
        initial={{ opacity: 0, y: -8, scale: 0.98 }} animate={{ opacity: 1, y: 0, scale: 1 }}
        transition={{ duration: 0.16, ease: 'easeOut' }}
        className="themed relative w-full max-w-xl overflow-hidden rounded-2xl border border-line bg-glass-strong shadow-lg backdrop-blur-xl"
      >
        <div className="flex items-center gap-2.5 border-b border-line-subtle px-4">
          <Search size={16} aria-hidden className="shrink-0 text-fg-muted" />
          <input
            ref={inputRef} value={q} onChange={(e) => setQ(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Escape') onClose(); }}
            placeholder="Jump to a view, a past run, or a saved match…"
            aria-label="Search"
            className="h-12 flex-1 border-0 bg-transparent text-body text-fg placeholder:text-fg-muted focus:outline-none focus:ring-0"
          />
          <kbd className="shrink-0 rounded border border-line bg-surface px-1.5 py-0.5 text-xs text-fg-muted">esc</kbd>
        </div>

        <div className="max-h-[52vh] overflow-y-auto p-2">
          {views.length > 0 && (
            <>
              <p className="px-3 pb-1 pt-2 text-xs font-semibold uppercase tracking-wide text-fg-muted">Go to</p>
              {views.map((n) => <Row key={n.id} Icon={n.icon} title={n.label} onPick={() => go(n.id)} />)}
            </>
          )}
          {runs.length > 0 && (
            <>
              <p className="px-3 pb-1 pt-3 text-xs font-semibold uppercase tracking-wide text-fg-muted">Past runs</p>
              {runs.map((h) => (
                <Row key={h.id} Icon={History} title={h.title || 'Untitled search'}
                     sub={`${h.count ?? h.jobCount ?? 0} profiles · ${timeAgo(h.createdAt || h.created_at)}`}
                     onPick={() => openHistory(h)} />
              ))}
            </>
          )}
          {matches.length > 0 && (
            <>
              <p className="px-3 pb-1 pt-3 text-xs font-semibold uppercase tracking-wide text-fg-muted">Saved matches</p>
              {matches.map((j) => (
                <Row key={jobKey(j)} Icon={Bookmark} title={j.title || 'Untitled role'} sub={j.company}
                     onPick={() => go('saved')} />
              ))}
            </>
          )}
          {views.length === 0 && runs.length === 0 && matches.length === 0 && (
            <p className="px-3 py-8 text-center text-sm text-fg-muted">No matches for “{q}”.</p>
          )}
        </div>
      </motion.div>
    </div>
  );
}

            on={recommend && useAi} onChange={setRecommend} disabled={!useAi}
            note={!useAi ? 'Needs semantic scoring on' : null}
          />

          <div>
            <FieldLabel htmlFor="seniority"
              aside={<span className="rounded-full border border-brand-border bg-brand-subtle px-2 py-0.5 text-xs font-semibold text-brand-text">
                {SENIORITY[sIndex].label}
              </span>}>
              Seniority focus
            </FieldLabel>
            <input
              id="seniority" type="range" className="rayn-range"
              min={0} max={SENIORITY.length - 1} step={1} value={sIndex}
              style={{ '--fill': `${fill}%` }}
              aria-valuetext={SENIORITY[sIndex].label}
              onChange={(e) => setSeniority(SENIORITY[Number(e.target.value)].id)}
            />
            <div aria-hidden className="mt-1 flex justify-between text-xs text-fg-muted">
              <span>Any</span><span>Senior</span><span>Principal</span>
            </div>
          </div>
        </BentoCard>
      </div>
    </section>
  );
}

function AgentDock({ open, setOpen, plan, loading, error, jobs, onGenerate, onClear }) {
  const bodyRef = useRef(null);
  const nearMiss = jobs.filter((j) => j.matchScore != null && j.matchScore >= 40 && j.matchScore < 75).length;
  const strong = jobs.filter((j) => (j.matchScore ?? 0) >= 75).length;

  useEffect(() => {
    if (open && bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [plan, loading, open]);

  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, setOpen]);

  return (
    <>
      {open && (
        <div id="agent-panel" role="dialog" aria-label={`${AGENT_NAME}, career coach`}
             className="fade-up themed fixed bottom-24 right-5 z-50 flex max-h-[min(72vh,640px)] w-[380px] max-w-[calc(100vw-2.5rem)] flex-col overflow-hidden rounded-xl border border-line bg-surface shadow-lg">

          <header className="flex shrink-0 items-center gap-2.5 border-b border-line-subtle bg-surface-sunken px-3 py-2.5">
            <span aria-hidden className="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-brand text-brand-on">
              <GraduationCap size={16} />
            </span>
            <div className="min-w-0 flex-1 leading-tight">
              <p className="truncate text-sm font-semibold text-fg">{AGENT_NAME}</p>
              <p className="truncate text-xs text-fg-muted">Career coach</p>
            </div>
            {plan && <Button size="sm" variant="ghost" onClick={onClear}>Clear</Button>}
            <button onClick={() => setOpen(false)} aria-label="Close panel"
                    className={`rounded-md p-1.5 text-fg-muted transition-colors hover:bg-surface-hover hover:text-fg ${ring}`}>
              <X size={15} />
            </button>
          </header>

          <div ref={bodyRef} className="min-h-0 flex-1 space-y-4 overflow-y-auto p-3">
            <Bubble>
              I looked at your <b className="font-semibold text-fg">{jobs.length}</b> matches.{' '}
              {strong > 0 && <><b className="font-semibold text-fg">{strong}</b> already match strongly. </>}
              {nearMiss > 0
                ? <>Another <b className="font-semibold text-fg">{nearMiss}</b> are near misses — close enough that a focused plan could reach them.</>
                : <>There are no near-miss roles here, so there is nothing worth planning for yet.</>}

            {loading && (
              <div className="flex items-center gap-2 text-sm text-fg-muted">
                <Loader2 size={14} aria-hidden className="animate-spin text-brand-text" />
                Reading the gaps and drafting your plan…

          <footer className="shrink-0 border-t border-line-subtle bg-surface-sunken p-3">

              {loading
                ? <><Loader2 size={14} aria-hidden className="animate-spin" /> Working…</>
                : plan ? <>Rebuild the plan</> : <><Sparkles size={14} aria-hidden /> Build my plan</>}

            <p className="mt-2 text-center text-xs text-fg-muted">

/* ═══════════════════════ reach out — founder ya HR ═══════════════════════ */
/* Faisla backend ka hai (app/outreach.py): company me FOUNDER_MAX_EMPLOYEES se
   kam log hain to seedha founder, warna HR. UI sirf wahi faisla, uski wajah aur
   bheja jaane wala message dikhata hai. */

const FOUNDER = 'founder';

const targetLook = (target) => (target === FOUNDER
  ? { Icon: UserRound, label: 'Founder / CEO', chip: 'border-brand-border bg-brand-subtle text-brand-text' }
  : { Icon: Briefcase, label: 'HR / Recruiter', chip: 'border-info-border bg-info-subtle text-info-text' });

function TargetChip({ target }) {
  const { Icon, label, chip } = targetLook(target);
  return (
    <span className={`inline-flex shrink-0 items-center gap-1.5 rounded-md border px-2 py-0.5 text-xs font-semibold ${chip}`}>
      <Icon size={12} aria-hidden /> {label}
    </span>
  );
}

/* Size ek hi jagah se likhi jaati hai — kabhi exact ginti, kabhi sirf band. */
function sizeLine(draft) {
  if (draft.employees) return `~${draft.employees.toLocaleString()} employees`;
  if (draft.sizeBand && draft.sizeBand !== 'unknown') return `${draft.sizeBand} employees`;
  return 'Company size unknown';
}

/* Har text block ke saath copy button — message haath se select karna hi
   sabse zyada chidhane wala step tha. */
function CopyBox({ label, value, hint }) {
  const [done, setDone] = useState(false);
  if (!value) return null;

  const copy = async () => {
    if (!(await copyText(value))) return;
    setDone(true);
    setTimeout(() => setDone(false), 1600);
  };

  return (
    <div>
      <div className="flex items-center justify-between gap-2">
        <p className="text-xs font-semibold uppercase tracking-wide text-fg-muted">{label}</p>
        <Button size="sm" variant="ghost" onClick={copy} aria-label={`Copy ${label.toLowerCase()}`}>
          {done
            ? <><Check size={12} aria-hidden className="text-success-text" /> Copied</>
            : <><Copy size={12} aria-hidden /> Copy</>}
        </Button>
      </div>
      <p className="mt-1 whitespace-pre-wrap rounded-lg border border-line bg-surface-sunken px-3 py-2 text-sm leading-6 text-fg-sec">{value}</p>
      {hint && <p className="mt-1 text-xs text-fg-muted">{hint}</p>}
    </div>
  );
}

function OutreachBody({ draft }) {
  const note = draft.connectionNote || '';

  return (
    <div className="space-y-4">
      {/* sabse upar faisla: kis tak jaana hai aur kyun */}
      <div className="rounded-lg border border-line bg-surface-sunken p-3">
        <div className="flex flex-wrap items-center gap-2">
          <TargetChip target={draft.target} />
          <span className="min-w-0 truncate text-sm font-medium text-fg">{draft.targetRole || targetLook(draft.target).label}</span>
          <span className="ml-auto shrink-0 text-xs tabular-nums text-fg-muted">{sizeLine(draft)}</span>
        </div>
        <p className="mt-2 text-sm leading-5 text-fg-sec">{draft.targetReason}</p>
        {draft.sizeBasis && (
          <p className="mt-1 text-xs text-fg-muted">
            Estimate: {draft.sizeBasis}{draft.confidence ? ` · ${draft.confidence} confidence` : ''}
          </p>
        )}
        {draft.targetAdjusted && (
          <p className="mt-2 flex items-start gap-1.5 text-xs text-warning-text">
            <AlertTriangle size={12} aria-hidden className="mt-px shrink-0" />
            The model wrote for a different contact — reread the tone before you send it.
          </p>
        )}
      </div>

      <div className="flex flex-wrap items-center gap-x-3 gap-y-2">
        {draft.searchUrl && (
          <a href={draft.searchUrl} target="_blank" rel="noopener"
             className={`inline-flex h-8 items-center gap-1.5 rounded-md border border-line bg-surface px-3 text-sm font-medium text-fg-sec shadow-sm transition-colors hover:border-line-strong hover:bg-surface-hover ${ring}`}>
            <Search size={12} aria-hidden /> Find this person on LinkedIn <ExternalLink size={11} aria-hidden />
          </a>
        )}
        {draft.channel && <span className="text-xs text-fg-muted">Best channel — <b className="font-semibold text-fg-sec">{draft.channel}</b></span>}
      </div>

      <CopyBox label="Subject" value={draft.subject} />
      <CopyBox label="Message" value={draft.message} />

               hint={note ? `${note.length} characters — LinkedIn invites cut off at 300.` : null} />

      {draft.targetWhy && <p className="text-xs text-fg-muted">Why this person: {draft.targetWhy}</p>}
    </div>
  );
}

        <div className="min-h-0 flex-1 overflow-y-auto p-4">

            </>
          )}

          {!loading && !error && draft && <OutreachBody draft={draft} />}
        </div>
      </div>
    </div>
  );
}

const CONTACT_TABS = [

function Pipeline({ jobs, skills, busy, stage, savedKeys, onSave, onExport, drafts = {}, onReachOut }) {
  const [q, setQ] = useState('');
  const [sort, setSort] = useState('relevance');
  const [src, setSrc] = useState('all');
  const [minScore, setMinScore] = useState('all');

  const rows = useMemo(() => {
    const needle = q.trim().toLowerCase();
    const out = jobs.filter((j) => {
      if (needle && !`${j.title || ''} ${j.company || ''} ${j.location || ''}`.toLowerCase().includes(needle)) return false;
      if (src !== 'all' && j.source !== src) return false;
      if (minScore !== 'all' && (j.matchScore ?? -1) < +minScore) return false;
      return true;
    });
    const by = {
      relevance: (a, b) => (b.matchScore ?? -1) - (a.matchScore ?? -1),
      recent: (a, b) => String(b.postedAt || '').localeCompare(String(a.postedAt || '')),
      company: (a, b) => String(a.company || '').localeCompare(String(b.company || '')),
      title: (a, b) => String(a.title || '').localeCompare(String(b.title || '')),
    };
    return [...out].sort(by[sort]);
  }, [jobs, q, sort, src, minScore]);

  // Skeletons sirf tab tak jab tak ek bhi job nahi aayi. Jobs aate hi asli
  // rows dikhte hain aur scoring upar ke bar me chalti rehti hai.
  if (busy && !jobs.length) {
    return (
      <Card className="overflow-hidden">
        <div className="border-b border-line-subtle px-4 py-3">
          <div className="flex items-center gap-2">
            <Loader2 size={14} aria-hidden className="animate-spin text-brand-text" />
            <span className="text-sm font-medium text-fg">{stage}</span>
          </div>
          <div className="progress-indeterminate relative mt-2 h-0.5 overflow-hidden rounded-full bg-neutral-subtle" />
        </div>
        <ul className="divide-y divide-line-subtle">{[0, 1, 2, 3, 4].map((i) => <SkeletonRow key={i} />)}</ul>
      </Card>
    );
  }

  if (!jobs.length) {
    return (
      <Card className="px-6 py-12">
        <div className="mx-auto max-w-sm text-center">
          <div aria-hidden className="mx-auto grid h-10 w-10 place-items-center rounded-lg border border-line bg-surface-sunken">
            <Users size={18} className="text-fg-muted" />
          </div>
          <h3 className="mt-3 text-h3 font-semibold text-fg">Your candidate pipeline will appear here</h3>
          <p className="mt-1 text-sm text-fg-muted">Start a search to discover and rank candidates based on your job description.</p>
        </div>
      </Card>
    );
  }

  return (
    <Card className="overflow-hidden">
      {busy && (
        <div className="border-b border-line-subtle bg-surface-sunken px-4 py-2">
          <div className="flex items-center gap-2">
            <Loader2 size={13} aria-hidden className="animate-spin text-brand-text" />
            <span className="text-sm font-medium text-fg-sec">{stage}</span>
            <span className="text-sm text-fg-muted">— scores will fill in shortly</span>
          </div>
          <div className="progress-indeterminate relative mt-1.5 h-0.5 overflow-hidden rounded-full bg-neutral-subtle" />
        </div>
      )}
      <div className="flex flex-wrap items-center gap-2 border-b border-line-subtle px-4 py-2.5">
        <h3 className="mr-1 text-sm font-semibold text-fg">
          {rows.length.toLocaleString()} <span className="font-normal text-fg-muted">of {jobs.length} matches</span>
        </h3>
        <div className="relative min-w-[180px] flex-1 sm:max-w-64">
          <Search size={14} aria-hidden className="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-fg-muted" />
          <input type="search" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Search results"
                 placeholder="Search role, company…"
                 className={`h-8 w-full rounded-md border border-line bg-input pl-8 pr-3 text-sm text-fg shadow-sm placeholder:text-fg-muted transition-colors hover:border-line-strong ${ring}`} />
        </div>
        <Select value={sort} onChange={setSort} options={SORTS} label="Sort by" className="w-36" />
        <Select value={src} onChange={setSrc} options={[{ id: 'all', label: 'All sources' }, { id: 'linkedin', label: 'LinkedIn' }, { id: 'indeed', label: 'Indeed' }]} label="Filter by source" className="w-32" />
        <Select value={minScore} onChange={setMinScore} options={SCORE_FILTERS} label="Filter by score" className="w-32" />
        <Button size="sm" onClick={onExport} className="ml-auto"><Download size={13} aria-hidden /> Export CSV</Button>
      </div>

      {rows.length === 0 ? (
        <div className="px-6 py-10 text-center">
          <p className="text-h3 font-medium text-fg">No matches for these filters</p>
          <p className="mt-1 text-sm text-fg-muted">Try clearing the search box or lowering the score filter.</p>
          <Button size="sm" className="mt-3" onClick={() => { setQ(''); setSrc('all'); setMinScore('all'); }}>Clear filters</Button>
        </div>
      ) : (
        <ul className="divide-y divide-line-subtle">
          {rows.map((j) => (
            <JobRow key={jobKey(j)} job={j} skills={skills} saved={savedKeys.has(jobKey(j))} onSave={onSave}
                    draft={drafts[jobKey(j)]} onReachOut={onReachOut} />
          ))}
        </ul>
      )}
    </Card>
  );
}

/* Sab kuch already loaded state se banta hai — /api/stats, history aur
   maujooda pipeline. Koi naya endpoint nahi. */
function Analytics({ stats, history, jobs, saved, spend }) {
  const bands = useMemo(() => {
    const scored = jobs.filter((j) => j.matchScore != null);
    const bucket = { strong: 0, good: 0, partial: 0, weak: 0 };
    for (const j of scored) {
      if (j.matchScore >= 75) bucket.strong++;
      else if (j.matchScore >= 55) bucket.good++;
      else if (j.matchScore >= 35) bucket.partial++;
      else bucket.weak++;
    }
    return { total: scored.length, ...bucket };
  }, [jobs]);

  const rows = [
    { id: 'strong', label: 'Strong match (75+)', n: bands.strong, cls: 'bg-success' },
    { id: 'good', label: 'Good match (55–74)', n: bands.good, cls: 'bg-warning' },
    { id: 'partial', label: 'Partial match (35–54)', n: bands.partial, cls: 'bg-info' },
    { id: 'weak', label: 'Weak match (<35)', n: bands.weak, cls: 'bg-neutral-fill' },
  ];

  const runs = history.slice(0, 8);
  const maxCount = Math.max(1, ...runs.map((h) => h.count ?? 0));

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 gap-3 lg:grid-cols-5">
        <StatTile label="Sourcing runs" value={stats.searches ?? 0} hint="All time" />
        <StatTile label="Profiles sourced" value={stats.roles ?? 0} hint="Across every run" />
        <StatTile label="Avg match score" value={stats.avgScore == null ? '—' : `${Math.round(stats.avgScore)}%`} hint="Scored profiles only" />
        <StatTile label="Saved matches" value={saved.length} hint="Your shortlist" />
        <StatTile label="Compute spend" value={`$${spend.toFixed(2)}`} hint={`of $${PLAN_BUDGET.toFixed(2)} budget`} />
      </div>

      <Card className="p-5">
        <h3 className="text-h2 font-semibold text-fg">Match quality — current pipeline</h3>
        <p className="mt-0.5 text-sm text-fg-muted">
          {bands.total === 0 ? 'Run a search with scoring on to see the distribution.' : `${bands.total} scored profiles in the open pipeline.`}
        </p>
        <ul className="mt-4 space-y-3">
          {rows.map((r) => {
            const pct = bands.total ? (r.n / bands.total) * 100 : 0;
            return (
              <li key={r.id}>
                <div className="flex items-center justify-between text-sm">
                  <span className="text-fg-sec">{r.label}</span>
                  <span className="tabular-nums text-fg-muted">{r.n}</span>
                </div>
                <div className="mt-1 h-2 overflow-hidden rounded-full bg-neutral-subtle">
                  <motion.div initial={{ width: 0 }} animate={{ width: `${pct}%` }}
                              transition={{ type: 'spring', stiffness: 160, damping: 24 }}
                              className={`h-full rounded-full ${r.cls}`} />
                </div>
              </li>
            );
          })}
        </ul>
      </Card>

      <Card className="p-5">
        <h3 className="text-h2 font-semibold text-fg">Recent runs</h3>
        {runs.length === 0 ? (
          <p className="mt-2 text-sm text-fg-muted">No runs yet.</p>
        ) : (
          <ul className="mt-4 space-y-3">
            {runs.map((h) => (
              <li key={h.id} className="flex items-center gap-3">
                <span className="w-40 shrink-0 truncate text-sm text-fg-sec" title={h.title}>{h.title || 'Untitled search'}</span>
                <span className="h-2 flex-1 overflow-hidden rounded-full bg-neutral-subtle">
                  <motion.span initial={{ width: 0 }} animate={{ width: `${((h.count ?? 0) / maxCount) * 100}%` }}
                               transition={{ type: 'spring', stiffness: 160, damping: 24 }}
                               className="accent-grad block h-full rounded-full" />
                </span>
                <span className="w-24 shrink-0 text-right text-xs tabular-nums text-fg-muted">
                  {h.count ?? 0} · ${Number(h.cost || 0).toFixed(2)}
                </span>
              </li>
            ))}
          </ul>
        )}
      </Card>
    </div>
  );
}

  const [attached, setAttached] = useState(null);
  const [uploading, setUploading] = useState(false);

  const [health, setHealth] = useState(null);
  const [model, setModel] = useState('deepseek/deepseek-v4-pro');
  const [toasts, setToasts] = useState([]);
  /* Bell ke liye — har toast yahan bhi girta hai, aur unread count
     tab tak badhta hai jab tak panel khola na jaaye. */
  const [log, setLog] = useState([]);
  const [seen, setSeen] = useState(0);
  /* history / saved / spend — teeno server par rehte hain (Postgres), state sirf
     unka cache hai. Isi liye har mutation ke baad refresh() chalta hai. */
  const [history, setHistory] = useState([]);
  const [saved, setSaved] = useState([]);
  const [stats, setStats] = useState({ searches: 0, roles: 0, spend: 0, avgScore: null, saved: 0 });
  const [historyLoading, setHistoryLoading] = useState(true);
  const [dbOk, setDbOk] = useState(true);
  const [searchId, setSearchId] = useState(null);   // abhi ki run ki DB row id

  /* reach out — jobKey se keyed drafts, aur abhi khula hua modal */
  const [drafts, setDrafts] = useState({});
  const [outreachJob, setOutreachJob] = useState(null);
  const [outreachLoading, setOutreachLoading] = useState(false);
  const [outreachError, setOutreachError] = useState('');

  const pipelineRef = useRef(null);

  const savedKeys = useMemo(() => new Set(saved.map(jobKey)), [saved]);
  const readySources = sources.length || 1;
  const profiles = limit * readySources;
  const cost = (profiles * COST_PER_JOB).toFixed(2);
  const seconds = SECONDS_PER_SOURCE * readySources + (useAi ? 30 : 0);
  const spend = stats.spend || 0;
  const skills = params?.mustHaveSkills || [];
  const creditsLeft = Math.max(0, PLAN_BUDGET - spend);
  const showAgent = recommend && useAi && !busy && jobs.length > 0;
  const unread = Math.max(0, log.length - seen);

  const setTheme = useCallback((mode) => {
    setThemeState(mode);
    document.documentElement.setAttribute('data-theme', mode);
    store.set('ha.theme', mode);
  }, []);

  const toggleRail = useCallback((next) => { setCollapsed(next); store.set('ha.rail', next); }, []);

  const toast = useCallback((type, title, body) => {
    const id = Date.now() + Math.random();
    const entry = { id, type, title, body, at: new Date().toISOString() };
    setToasts((t) => [...t, entry]);
    setLog((l) => [entry, ...l].slice(0, 30));
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4500);
  }, []);
  const dismiss = useCallback((id) => setToasts((t) => t.filter((x) => x.id !== id)), []);

  /* ⌘K / Ctrl+K palette kholta hai — input ke andar bhi kaam karta hai. */
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setPaletteOpen((o) => !o);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  /* Server se history + shortlist + stats dobara le aata hai. */
  const refresh = useCallback(async () => {
    try {
      const [h, s, st] = await Promise.all([
        api.get('/api/searches?limit=50'),
        api.get('/api/saved'),
        api.get('/api/stats'),
      ]);
      setHistory(h.searches || []);
      setSaved(s.saved || []);
      setStats(st);
    } catch {
      /* DB down — health check pehle hi bata dega, dobara toast nahi karte */
    } finally {
      setHistoryLoading(false);
    }
  }, []);

  useEffect(() => {
    fetch('/api/health').then((r) => r.json()).then(async (h) => {
      setHealth(h);
      setModel(h.model);
      const missing = [];
      if (!h.apifyKey) missing.push('APIFY_API_KEY');
      if (!h.openRouterKey) missing.push('OPENROUTER_API_KEY');
      if (missing.length) toast('error', 'Missing API keys', `${missing.join(' and ')} not found in .env — searches will fail.`);

      const db = h.db || {};
      setDbOk(!!db.connected);
      if (!db.connected) {
        setHistoryLoading(false);
        toast('warning', 'Database not connected',
          db.configured ? `${db.error || 'Connection failed'} — history and saved matches will not be stored.`
                        : 'DATABASE_URL is not set in .env — history and saved matches will not be stored.');
        return;
      }

      // Purana browser-only data ek hi baar DB me chala jaata hai. Flag tabhi
      // set hota hai jab import sach me ho gaya ho — warna agli baar phir koshish.
      if (!store.get('ha.migrated', false)) {
        const legacy = { searches: store.get('ha.history', []), saved: store.get('ha.saved', []) };
        if (!legacy.searches.length && !legacy.saved.length) {
          store.set('ha.migrated', true);
        } else {
          try {
            const out = await api.post('/api/import', legacy);
            store.set('ha.migrated', true);
            if (out.searches || out.saved) {
              toast('success', 'Moved into the database',
                `${out.searches} search${out.searches === 1 ? '' : 'es'} and ${out.saved} saved job${out.saved === 1 ? '' : 's'} imported from this browser.`);
            }
          } catch (e) {
            toast('warning', 'Could not import old browser data', e.message);
          }
        }
      }

      refresh();
    }).catch(() => setHistoryLoading(false));
  }, [toast, refresh]);

  const uploadFile = useCallback(async (file) => {
    setUploading(true);
    setJdError('');
    try {
      const body = new FormData();
      body.append('file', file);
      const res = await fetch('/api/extract', { method: 'POST', body });
      const data = await res.json();
      if (!res.ok) { toast('error', 'Unable to parse document', data.error || 'Unsupported or unreadable file.'); return; }
      setJd(data.text);
      setAttached({ name: data.filename, size: file.size, words: data.words });
      setStudioTab('prompt');
      toast('success', 'Document parsed', `${data.words.toLocaleString()} words extracted locally — no tokens used.`);
    } catch (e) {
      toast('error', 'Upload failed', e.message);
    } finally {
      setUploading(false);
    }
  }, [toast]);

  /* URL ko prompt me context line ki tarah jodte hain — page ko crawl nahi
     karte, isliye UI me bhi wahi likha hai. */
  const attachUrl = useCallback(() => {
    const url = poolUrl.trim();
    if (!url) return;
    setJd((prev) => (prev.includes(url) ? prev : `${prev.trimEnd()}${prev.trim() ? '\n\n' : ''}Reference posting: ${url}`));
    setPoolUrl('');
    setStudioTab('prompt');
    toast('info', 'Link added to the prompt', url);
  }, [poolUrl, toast]);

  const toggleSource = (id) => setSources((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));

  /* Shortlist ab saved_jobs table me hai. UI turant badalta hai, request peeche
     jaati hai — fail hone par wapas purani list par le aate hain. */
  const toggleSave = async (job) => {
    const k = jobKey(job);
    const wasSaved = savedKeys.has(k);
    const before = saved;

    setSaved((prev) => (wasSaved
      ? prev.filter((j) => jobKey(j) !== k)
      : [{ ...job, description: undefined }, ...prev]));

    try {
      if (wasSaved) {
        await api.del(`/api/saved?key=${encodeURIComponent(k)}`);
        toast('info', 'Removed from saved');
      } else {
        await api.post('/api/saved', { job: { ...job, description: undefined }, searchId });
        toast('success', 'Saved to shortlist', job.title);
      }
      api.get('/api/stats').then(setStats).catch(() => {});
    } catch (e) {
      setSaved(before);
      toast('error', wasSaved ? 'Could not remove' : 'Could not save', e.message);
    }
  };

  const exportCsv = (list) => {
    const cols = ['matchScore', 'matchReason', 'source', 'title', 'company', 'location',
      'contractType', 'experienceLevel', 'salary', 'postedAt', 'url'];
    const esc = (v) => `"${String(v ?? '').replace(/"/g, '""').replace(/\s+/g, ' ').trim()}"`;
    const csv = [cols.join(','), ...list.map((j) => cols.map((c) => esc(j[c])).join(','))].join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `rayn-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('success', 'CSV exported', `${list.length} rows downloaded.`);
  };

  const run = async () => {
    const jobDescription = jd.trim();
    if (jobDescription.length < 20) {
      setJdError('Add at least 20 characters of prompt — describe the profile or upload a document.');
      setView('new');
      setStudioTab('prompt');
      return;
    }
    if (sources.length === 0) { toast('error', 'No platforms selected', 'Pick at least one sourcing platform.'); return; }

    setJdError('');
    setBusy(true);
    setStage('Sourcing…');
    setJobs([]);
    setPlan(null);          // naya search = purana plan stale
    setPlanError('');
    setDrafts({});          // ...aur purane reach-out drafts bhi
    setOutreachJob(null);
    setSearchId(null);      // nayi DB row 'search' event ke saath aayegi
    setTimeout(() => pipelineRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);

    const apiSource = sources.length === 2 ? 'both' : sources[0];
    // Seniority prefix + manual title milkar scrape keyword banate hain.
    const prefix = SENIORITY.find((s) => s.id === seniority)?.prefix || '';
    const chosen = targetTitle.trim();
    const override = [prefix, chosen].filter(Boolean).join(' ').trim();

    try {
      const res = await fetch('/api/search', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobDescription, limit, source: apiSource, useAi, titleOverride: override || null }),
      });

      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        toast('error', 'Search failed', e.error || e.detail || `Request failed (${res.status})`);
        return;
      }

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const ev = JSON.parse(line);

          if (ev.type === 'progress') {
            // stage text asli stream stages se aata hai, timer se nahi
            if (ev.stage === 'parse') setStage('Reading prompt…');
            else if (ev.stage === 'score') setStage('Ranking profiles…');
            else setStage('Sourcing…');
            if (ev.isError) toast('warning', 'Pipeline warning', ev.message);
          } else if (ev.type === 'search') {
            // Backend ne searches table me row bana di — saved matches aur plan
            // isi id se jud jaate hain.
            setSearchId(ev.searchId);
          } else if (ev.type === 'params') {
            setParams(ev.params);
            if (!targetTitle.trim() && ev.params?.title) setTargetTitle(ev.params.title);
          } else if (ev.type === 'partial') {
            // sourcing ho gayi, scoring baaki — table abhi bhar do
            setJobs(ev.jobs);
            if (ev.params) setParams(ev.params);
          } else if (ev.type === 'error') {
            toast('error', 'Search failed', ev.message);
          } else if (ev.type === 'done') {
            setJobs(ev.jobs);
            setParams(ev.params || null);
            if (ev.searchId) setSearchId(ev.searchId);
            // Backend ne run ko already save kar diya hai — bas dobara padh lete hain.
            refresh();
            toast('success', `${ev.jobs.length} profiles matched`,
              useAi ? 'Ranked by fit against your prompt.' : 'AI ranking was off — results are unranked.');
          }
        }
      }
    } catch (e) {
      toast('error', 'Something went wrong', e.message);
    } finally {
      setBusy(false);
    }
  };

  const buildPlan = async () => {
    setPlanLoading(true);
    setPlanError('');
    try {
      const res = await fetch('/api/recommend', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ profile: jd.trim(), jobs, searchId }),
      });
      const data = await res.json();
      if (!res.ok) { setPlanError(data.error || `Request failed (${res.status})`); return; }
      setPlan(data.plan);
      setAgentOpen(true);
      refresh();   // plan bhi search ke saath store ho gaya — history badge update
      toast('success', `${data.plan.planDays}-day plan ready`, `${data.plan.unlocks?.length || 0} roles could open up.`);
    } catch (e) {
      setPlanError(e.message);
    } finally {
      setPlanLoading(false);
    }
  };

  /* ---------------------------- reach out ----------------------------
     Founder-ya-HR ka faisla server par hota hai (app/outreach.py); yahan bas
     draft mangwaate hain, cache karte hain aur modal me dikha dete hain. */

  const loadDrafts = useCallback(async (id) => {
    if (!id) { setDrafts({}); return; }
    try {
      const out = await api.get(`/api/outreach?searchId=${id}`);
      setDrafts(out.drafts || {});
    } catch {
      /* DB off — drafts sirf is session ke liye memory me rahenge */
    }
  }, []);

  const generateOutreach = useCallback(async (job) => {
    const profile = jd.trim();
    if (profile.length < 20) {
      setOutreachError('Add your prompt or resume under New Search first — the message is written from it.');
      return;
    }

    setOutreachLoading(true);
    setOutreachError('');
    try {
      const { __key, __stub, ...posting } = job;
      const data = await api.post('/api/outreach', { job: posting, profile, searchId });
      const key = data.key || keyOf(job);
      setDrafts((prev) => ({ ...prev, [key]: data.draft }));
      toast('success', `Draft ready — ${data.draft.targetLabel}`, data.draft.targetReason);
    } catch (e) {
      setOutreachError(e.message);
    } finally {
      setOutreachLoading(false);
    }
  }, [jd, searchId, toast]);

  /* Ek hi draft dobara nahi banwaate — pehle se hai to seedha khol dete hain. */
  const openOutreach = useCallback((job) => {
    setOutreachJob(job);
    setOutreachError('');
    if (!drafts[keyOf(job)]) generateOutreach(job);
  }, [drafts, generateOutreach]);

  const closeOutreach = useCallback(() => {
    setOutreachJob(null);
    setOutreachError('');
  }, []);

  /* Purani run kholna = DB se poora record wapas laana: jobs, JD, params aur
     agar plan bana tha to wo bhi. */
  const openHistory = async (h) => {
    try {
      const full = await api.get(`/api/searches/${h.id}`);
      setJobs(full.jobs || []);
      setParams(full.params || { title: full.title, mustHaveSkills: full.skills || [] });
      setSearchId(full.id);
      setPlan(full.plan || null);
      setPlanError('');
      loadDrafts(full.id);
      if (full.jobDescription) setJd(full.jobDescription);
      setView('matches');
    } catch (e) {
      toast('error', 'Could not open that run', e.message);
    }
  };

  const deleteSearch = async (h) => {
    try {
      await api.del(`/api/searches/${h.id}`);
      if (searchId === h.id) { setJobs([]); setParams(null); setSearchId(null); }
      toast('info', 'Run deleted', h.title);
      refresh();
    } catch (e) {
      toast('error', 'Could not delete', e.message);
    }
  };

  const clearHistory = async () => {
    try {
      const out = await api.del('/api/searches');
      setJobs([]); setParams(null); setSearchId(null);
      toast('info', 'History cleared', `${out.deleted} run${out.deleted === 1 ? '' : 's'} removed.`);
      refresh();
    } catch (e) {
      toast('error', 'Could not clear history', e.message);
    }
  };

  const titles = {
    overview: ['Overview', 'Your runs, matches, and usage at a glance.'],
    new: ['Launch New Candidate Search', 'Describe your ideal profile, select sourcing channels, and let RAYN rank top talent.'],
    searches: ['Talent Pool', 'Every sourcing run RAYN has completed for you.'],
    matches: ['Pipeline', 'The ranked pipeline from your most recent run.'],
    saved: ['Saved Matches', 'Profiles you shortlisted for a closer look.'],
    contacts: ['Outreach', `Who to message at each company — founder under ${FOUNDER_MAX_EMPLOYEES} employees, HR above it.`],
    analytics: ['Analytics', 'Match quality, sourcing volume, and compute spend.'],
    settings: ['Settings', 'Model, keys, storage and appearance.'],
  };
  const [pageTitle, pageSub] = titles[view];
  const navItem = NAV.find((n) => n.id === view);

  const sidebarProps = { view, setView, savedCount: saved.length, contactCount: Object.keys(drafts).length, spend };

  return (
    <div className="relative z-10 flex h-full overflow-hidden">
      {/* Rail hover par khulti hai aur content ko saath me sarka deti hai -
          overlay nahi karti, warna peeche ka content dhak jaata hai. Width ki
          transition Sidebar ke andar hai, isliye shift smooth rehta hai. */}
      <aside
        className="hidden shrink-0 lg:block"
        onMouseEnter={() => setRailHover(true)}
        onMouseLeave={() => setRailHover(false)}
      >
        <Sidebar {...sidebarProps} collapsed={collapsed && !railHover} setCollapsed={toggleRail} navId="rail" />
      </aside>

      <AnimatePresence>
        {drawer && (
          <div className="fixed inset-0 z-40 lg:hidden">
            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                        className="absolute inset-0 bg-overlay backdrop-blur-sm" onClick={() => setDrawer(false)} aria-hidden />
            <motion.div initial={{ x: -280 }} animate={{ x: 0 }} exit={{ x: -280 }}
                        transition={{ type: 'spring', stiffness: 340, damping: 34 }}
                        className="absolute left-0 top-0 h-full shadow-lg">
              <Sidebar {...sidebarProps} collapsed={false} navId="drawer" onNavigate={() => setDrawer(false)} />
            </motion.div>
          </div>
        )}
      </AnimatePresence>

      <div className="flex min-w-0 flex-1 flex-col">
        <TopBar theme={theme} setTheme={setTheme} model={model} creditsLeft={creditsLeft} dbOk={dbOk}
                log={log} unread={unread} markRead={() => setSeen(log.length)}
                viewLabel={navItem?.label} ViewIcon={navItem?.icon}
                onOpenNav={() => setDrawer(true)} onOpenPalette={() => setPaletteOpen(true)} />

        <main className="min-h-0 flex-1 overflow-y-auto">
          <div className="mx-auto max-w-[1280px] px-4 pt-6 pb-36 sm:px-6 sm:pt-8">

            <div className="mb-6">
              <h1 className="text-display font-bold tracking-tight text-fg">{pageTitle}</h1>
              <p className="mt-1.5 max-w-2xl text-body text-fg-sec">{pageSub}</p>
            </div>

            {view === 'new' && (
              <div className="space-y-8">
                <PromptStudio
                  jd={jd} setJd={setJd} attached={attached} setAttached={setAttached}
                  uploading={uploading} uploadFile={uploadFile} error={jdError}
                  tab={studioTab} setTab={setStudioTab}
                  poolUrl={poolUrl} setPoolUrl={setPoolUrl} onAttachUrl={attachUrl}
                />

                <PipelineConfig
                  limit={limit} setLimit={setLimit} cost={cost}
                  sources={sources} toggleSource={toggleSource}
                  targetTitle={targetTitle} setTargetTitle={setTargetTitle} detected={params?.title}
                  seniority={seniority} setSeniority={setSeniority}
                  useAi={useAi} setUseAi={setUseAi} recommend={recommend} setRecommend={setRecommend}
                />

                <ActionDock profiles={profiles} cost={cost} seconds={seconds} busy={busy} stage={stage}
                            blocked={sources.length === 0} onLaunch={run} />

                <section ref={pipelineRef} aria-labelledby="pipe-head" className="scroll-mt-6">
                  <SectionHead title={<span id="pipe-head">Candidate pipeline</span>}
                               description={jobs.length ? 'Ranked by how closely each profile matches your prompt.' : 'Results land here once the pipeline finishes.'} />
                  <Pipeline jobs={jobs} skills={skills} busy={busy} stage={stage}
                            savedKeys={savedKeys} onSave={toggleSave} onExport={() => exportCsv(jobs)}
                            drafts={drafts} onReachOut={openOutreach} />
                </section>
              </div>
            )}

            {view === 'overview' && <Overview history={history} stats={stats} go={setView} />}
            {view === 'searches' && <Searches history={history} loading={historyLoading} onOpen={openHistory}
                                              onClear={clearHistory} onDelete={deleteSearch} />}
            {view === 'matches' && (
              <Pipeline jobs={jobs} skills={skills} busy={busy} stage={stage}
                        savedKeys={savedKeys} onSave={toggleSave} onExport={() => exportCsv(jobs)}
                        drafts={drafts} onReachOut={openOutreach} />
            )}
            {view === 'contacts' && <Contacts drafts={drafts} jobs={jobs} onOpen={openOutreach} />}
            {view === 'analytics' && <Analytics stats={stats} history={history} jobs={jobs} saved={saved} spend={spend} />}
            {view === 'settings' && (
              <SettingsView health={health} theme={theme} setTheme={setTheme}
                            creditsLeft={creditsLeft} onClearHistory={clearHistory} />
            )}

            {view === 'saved' && (
              saved.length === 0
                ? <EmptyState Icon={Bookmark} title="Nothing saved yet" body="Use Save on any result to shortlist it here." />
                : (
                  <Card className="overflow-hidden">
                    <div className="border-b border-line-subtle px-4 py-2.5">
                      <h3 className="text-sm font-semibold text-fg">{saved.length} saved</h3>
                    </div>
                    <ul className="divide-y divide-line-subtle">
                      {saved.map((j) => (
                        <JobRow key={jobKey(j)} job={j} skills={skills} saved onSave={toggleSave}
                                draft={drafts[jobKey(j)]} onReachOut={openOutreach} />
                      ))}
                    </ul>
                  </Card>
                )
            )}
          </div>
        </main>
      </div>

      <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)}
                      go={setView} history={history} saved={saved} openHistory={openHistory} />

      {/* Kai sirf tab dikhta hai jab recommendations on hon aur results maujood hon */}
      {showAgent && (
        <AgentDock open={agentOpen} setOpen={setAgentOpen} plan={plan} loading={planLoading}
                   error={planError} jobs={jobs} onGenerate={buildPlan}
                   onClear={() => { setPlan(null); setPlanError(''); }} />
      )}

      {outreachJob && (
        <OutreachModal job={outreachJob} draft={drafts[keyOf(outreachJob)]}
                       loading={outreachLoading} error={outreachError}
                       onClose={closeOutreach} onRetry={() => generateOutreach(outreachJob)} />
      )}

      <Toasts items={toasts} dismiss={dismiss} raised={showAgent} />
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
